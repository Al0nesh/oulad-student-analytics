# Local Jenkins server for this project (Docker Desktop on Windows, macOS or Linux).
#
#   cd jenkins
#   docker compose up -d --build
#   open http://localhost:8080   user: admin   password: admin  (or set JENKINS_ADMIN_PASSWORD)
#
# Jenkins talks to the host's Docker through the mounted socket ("Docker outside of Docker"),
# so images it builds and test containers it starts appear in Docker Desktop.
name: oulad-ci

services:
  jenkins:
    build: .
    image: oulad-jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    # root inside the container is needed to use /var/run/docker.sock on Docker Desktop.
    # Acceptable for a local lab; on a shared server use a dedicated agent instead.
    user: root
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      CASC_JENKINS_CONFIG: /casc/casc.yaml
      JENKINS_ADMIN_ID: admin
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./casc.yaml:/casc/casc.yaml:ro

volumes:
  jenkins_home:
