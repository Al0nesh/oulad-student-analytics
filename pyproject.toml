[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oulad-analytics"
version = "0.1.0"
description = "Early prediction of at-risk students from OULAD learning-analytics data: loading, validation, feature engineering, baseline models and plots."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alisher Ulkhanov" }]
requires-python = ">=3.10"
keywords = ["learning analytics", "educational data mining", "OULAD", "machine learning", "student performance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]

[project.scripts]
oulad-analytics = "oulad_analytics.cli:main"

[project.urls]
Repository = "https://github.com/Al0nesh/oulad-student-analytics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["oulad_analytics"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
